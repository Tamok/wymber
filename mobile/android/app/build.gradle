apply plugin: 'com.android.application'

// Upload-key signing (Play App Signing: this key only signs uploads; Google holds the
// distribution key). Resolution order: CI env vars -> local .secrets/android/keystore.properties
// (gitignored, see mobile/README) -> unsigned release (still buildable).
def signingProps = new Properties()
def signingPropsFile = System.getenv('WYMBER_KEYSTORE_PROPERTIES') != null
        ? file(System.getenv('WYMBER_KEYSTORE_PROPERTIES'))
        : file('../../../.secrets/android/keystore.properties')
if (System.getenv('KEYSTORE_FILE') != null) {
    signingProps['storeFile'] = System.getenv('KEYSTORE_FILE')
    signingProps['storePassword'] = System.getenv('KEYSTORE_PASSWORD')
    signingProps['keyAlias'] = System.getenv('KEY_ALIAS')
    signingProps['keyPassword'] = System.getenv('KEY_PASSWORD')
} else if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def hasUploadKey = signingProps['storeFile'] != null

android {
    namespace = "app.wymber"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.wymber"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadKey) {
                signingConfig signingConfigs.upload
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

