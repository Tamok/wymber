name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.15
      - run: ruff check .

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: python -m pytest tests/ -q

  frontend:
    name: Frontend unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm ci
      # frontend/tests/csp.test.js boots the built dist/ in a real browser: the only check that
      # the CSP, SRI and import-map integrity actually load the app together (ADR-0003 Layer 1).
      # npm ci does not fetch browser binaries, so install the one it needs.
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run
      # ADR-0003 Layer 2: structurally + chain-verify the committed transparency log on every
      # push. No signing key exists in CI (and never should, see scripts/sign-integrity-log.mjs's
      # own refusal to accept one from inside a repo checkout), so this deliberately does NOT
      # check signatures, only that landing/integrity-log.jsonl parses and its hash chain is
      # unbroken. It exists to catch a corrupted or hand-edited/rewritten log; it gates nothing
      # about whether a build is signed (signing is informational only).
      - run: node scripts/integrity-log.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # --workers=1: each unlock runs real PBKDF2 (600k); serial avoids crypto-load timeouts.
      - run: npx playwright test --workers=1
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploy the app to Cloudflare Pages once everything above is green (test-gated).
  #   push to main    -> PRODUCTION  -> web.wymber.app                 (what users see)
  #   push to develop -> PREVIEW     -> develop.wymber-app.pages.dev   (staging surface)
  # wrangler decides production vs preview from --branch vs the project's production branch (main).
  # Builds the static output via scripts/build-pages.mjs. See #116.
  deploy:
    name: Deploy app to Cloudflare Pages
    needs: [lint, backend, frontend, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Build the Pages output (dist/)
        run: node scripts/build-pages.mjs
      - name: Deploy to Cloudflare Pages (main = production, develop = preview)
        run: npx --yes wrangler@4 pages deploy dist --project-name=wymber-app --branch="${{ github.ref_name }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
