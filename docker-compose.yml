version: '3.8'

services:
  wymber:
    build: .
    container_name: wymber
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=production
      # Required: set JWT_SECRET_KEY in a .env file (see .env.example). Compose errors if unset.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in a .env file (see .env.example)}
      - AUTO_CREATE_TEST_USER=false
    restart: unless-stopped
