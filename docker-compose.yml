# Wymber is local-first: the encrypted vault lives in the browser, so this container just
# serves the static app. No accounts, no database, no secrets to configure.
services:
  wymber:
    build: .
    container_name: wymber
    ports:
      - "127.0.0.1:8080:8000"   # host 8080 -> app 8000, bound to localhost only
    restart: unless-stopped
